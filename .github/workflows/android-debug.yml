name: Android Debug

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false

      - name: Check public sources and licensing
        run: python3 scripts/preflight.py

      - name: Prepare required Android SDK packages
        run: python3 scripts/prepare_ci_sdk.py

      - name: JVM tests and Lint before APK assembly
        run: >-
          sh ./gradlew --no-daemon --console=plain
          --project-cache-dir .local/gradle
          :app:testDebugUnitTest :app:lintDebug

      - name: Assemble Debug APK
        run: >-
          sh ./gradlew --no-daemon --console=plain
          --project-cache-dir .local/gradle :app:assembleDebug

      - name: Verify APK and completed local checks
        run: python3 scripts/verify.py

      - name: Prepare Debug download with license notices
        run: python3 scripts/package_debug.py

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GMBG-Debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            .local/ci-artifact/GMBG-Debug.apk
            .local/ci-artifact/SHA256SUMS.txt
            .local/ci-artifact/LICENSE
            .local/ci-artifact/NOTICE
            .local/ci-artifact/ACKNOWLEDGEMENTS.md
            .local/ci-artifact/README.txt
            .local/ci-artifact/LICENSES/Apache-2.0.txt
            .local/ci-artifact/LICENSES/Gradle-Wrapper.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
